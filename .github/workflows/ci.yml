name: Server CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Tests & Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-that-is-at-least-32-chars-long
          GMAIL_USER: test@example.com
          GMAIL_APP_PASSWORD: testpassword1234
          CLIENT_ORIGIN: http://localhost:5173
          API_ORIGIN: http://localhost:5000
          GEMINI_MODEL: gemini-3.5-flash
          GROQ_MODEL: openai/gpt-oss-120b

  deploy:
    name: Auto-Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deploy Hook (Render / Railway)
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering deployment webhook..."
          curl -s -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
