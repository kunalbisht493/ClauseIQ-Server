services:
  api:
    build: .
    container_name: server_copy_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Override MONGODB_URI to point at the bundled mongo service
      MONGODB_URI: mongodb://mongo:27017/server_copy
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: server_copy_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  uploads_data:
  mongo_data:
